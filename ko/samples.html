  <h1>엔진이 실제로 내는 것</h1>
  <p class="sub">0-D 물리 엔진 Plasma Agent의 계산 결과 네 장과 화면 녹화 하나. 전부 일반 설계·정규화 값이며, 추세는 문헌·자체 측정 대비 ±20 %, 절대 밀도는 ×0.5~1.2 범위입니다.</p>

  <figure class="card">
    <video autoplay loop muted playsinline poster="../assets/demo_poster.jpg">
      <source src="../assets/demo_split_sweep.mp4" type="video/mp4">
      <img src="../assets/demo_split_sweep.gif" alt="화면 녹화 — 분배비를 바꾸면 0.2초 뒤 분포가 따라온다">
    </video>
    <figcaption><b>화면 녹화 — 분배비를 바꾸면 0.2초 뒤 분포가 따라온다</b><span>평판 이중 코일 ICP, Ar 20 mTorr, 1.5 kW. Inner/Outer 파워 몫을 10 → 50 → 90 %로 바꾸면 기판면 밀도 분포 곡선이 즉시 갱신됩니다. 17초, 무음. 치수·계수 패널은 가렸습니다.</span></figcaption>
  </figure>

  <div class="grid">
    <figure class="card">
      <img src="../assets/F1_power_split_profile.png" alt="F-1 · 분배비 → 기판면 플럭스 분포" loading="lazy">
      <figcaption><b>F-1 · 분배비 → 기판면 플럭스 분포</b><span>이중 코일 ICP, N₂ 10 mTorr, 1.5 kW. 다이얼 하나(Inner 몫 10/50/90 %)로 중심 볼록 ↔ 가장자리 볼록을 오갑니다. 50 % 중심값으로 정규화. 설계 선별과 구매 사양의 기준.</span></figcaption>
    </figure>
    <figure class="card">
      <img src="../assets/F2_pressure_power_sweep.png" alt="F-2 · 압력·파워 스윕 → Te, nₑ 추세 지도" loading="lazy">
      <figcaption><b>F-2 · 압력·파워 스윕 → Te, nₑ 추세 지도</b><span>176개 운전점, 점당 0.3초. 전자온도는 절대값(검증 ±0.3 eV), 전자밀도는 10 mTorr / 1.5 kW 기준점 대비 비. 공정 창을 미리 본다는 것이 이런 뜻입니다.</span></figcaption>
    </figure>
    <figure class="card">
      <img src="../assets/F3_icp_vs_ccp.png" alt="F-3 · 같은 조건에서 ICP vs CCP" loading="lazy">
      <figcaption><b>F-3 · 같은 조건에서 ICP vs CCP</b><span>Ar 20 mTorr, 500 W. 평판 ICP(ICP = 1) 대비 평행판 CCP 13.56 MHz: 전자온도 ×0.31, 기판 평균 이온 에너지 ×4.1, 기판 이온 선속 ×0.22. 소스 4형식이 한 인터페이스이므로 같은 조건에서 바로 비교됩니다. CCP 전자온도는 이중온도 모델의 유효 온도.</span></figcaption>
    </figure>
    <figure class="card">
      <img src="../assets/F4_treatment_map.png" alt="F-4 · 플라즈마 처리 맵 (예시)" loading="lazy">
      <figcaption><b>F-4 · 플라즈마 처리 맵 (예시)</b><span>Process Models — 분배 A(중심 가중) / B(가장자리 가중)의 13점(1-4-8) 상대 처리량, 최대값 = 1. 불균일도 3 % 대 7 %. 자체 측정으로 보정한 모델 예시이며 절대 농도·시간은 표시하지 않습니다.</span></figcaption>
